        <div class="modal-actions field full">
          <button class="btn" type="button" data-action="close">Cancel</button>
          <button class="btn btn-primary" type="button" data-save>Save</button>
        </div>
      </div>`, (m) => {
      const status = m.querySelector("#hStatus");
      const fail = (msg) => { status.textContent = msg; status.style.color = "var(--danger)"; };
      wireSave(m, () => {
        const k = m.querySelector("#g-key").value.trim();
        const u = m.querySelector("#h-url").value.trim().replace(/\/+$/, "");
        if (k && !/^[A-Za-z0-9_-]{30,60}$/.test(k)) return fail("That doesn't look like a Google API key. It usually starts with AIza and has no spaces.");
        if (u && !/^https:\/\/[^\s/]+\.[^\s]+$/.test(u)) return fail("Enter the helper's full address, starting with https://");
        const keyChanged = k !== googleKey;
        helperUrl = u; googleKey = k;
        try {
          u ? localStorage.setItem(HELPER_KEY, u) : localStorage.removeItem(HELPER_KEY);
          k ? localStorage.setItem(GKEY_KEY, k) : localStorage.removeItem(GKEY_KEY);
        } catch (e) {}

        // Google Maps can only be loaded once per page, so a new key needs a fresh load.
        if (keyChanged && googleLoad) { toast("Saved. Reloading to use the new key…"); setTimeout(() => location.reload(), 800); return; }
        googleAuthError = false;
        render(); toast("Settings saved");
      });
    });
  }

  /* ---------- Modals ----------
     Saving uses a plain click handler, not the form "submit" event, because
     some embedded viewers block form submission entirely. */
  function openModal(title, bodyHTML, onMount) {
    const root = document.getElementById("modalRoot");
    root.innerHTML = `<div class="overlay" data-overlay><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h3>${esc(title)}</h3></div><div class="modal-body">${bodyHTML}</div></div></div>`;
    const m = root.querySelector(".modal");
    const first = m.querySelector("input:not([type=hidden]), select, textarea");
    if (first) first.focus();
    onMount && onMount(m);
  }
  function closeModal() { document.getElementById("modalRoot").innerHTML = ""; }
  function wireSave(m, onSave) {
    m.querySelector("[data-save]").addEventListener("click", onSave);
    m.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && e.target.tagName === "INPUT") { e.preventDefault(); onSave(); }
    });
  }
  function readFields(m) {
    const out = {};
    m.querySelectorAll("[name]").forEach((el) => { out[el.name] = el.value; });
    return out;
  }

  // Two-step delete: first tap arms, second tap within 4s deletes.
  function armDelete(btn, armedText, onConfirm) {
    const original = btn.textContent;
    let armed = false, timer;
    btn.addEventListener("click", () => {
      if (armed) { clearTimeout(timer); onConfirm(); return; }
      armed = true; btn.textContent = armedText; btn.classList.add("btn-primary");
      timer = setTimeout(() => { armed = false; btn.textContent = original; btn.classList.remove("btn-primary"); }, 4000);
    });
  }

  /* ---------- Data import/export ---------- */
  function exportJSON() {
    const json = JSON.stringify(state, null, 2);
    try {
      const blob = new Blob([json], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `travel-planner-backup-${todayISO()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      toast("Backup downloaded");
    } catch (e) { toast("Download isn't available here. Use Copy as text."); }
  }
  function copyJSON() {
    const json = JSON.stringify(state, null, 2);
    const fallback = () => {
      openModal("Your data", `<p class="hint" style="margin:0 0 10px">Select all and copy this text. Save it somewhere safe.</p><textarea id="copyArea" style="width:100%;min-height:240px;font-family:var(--font-mono);font-size:.8rem;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:8px" readonly>${esc(json)}</textarea><div class="modal-actions" style="margin-top:12px"><button class="btn btn-primary" type="button" data-action="close">Done</button></div>`, (m) => { const ta = m.querySelector("#copyArea"); ta.focus(); ta.select(); });
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(json).then(() => toast("Copied to clipboard"), fallback);
      else fallback();
    } catch (e) { fallback(); }
  }
  function importFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const s = JSON.parse(reader.result);
        if (!s || !Array.isArray(s.trips)) throw new Error("bad");
        // Merge by trip, so importing never deletes trips you already have.
        s.trips.forEach((t) => {
          if (!t || !t.id) return;
          const i = state.trips.findIndex((x) => x.id === t.id);
          if (i >= 0) state.trips[i] = t; else state.trips.push(t);
        });
        state.activeId = s.trips[0]?.id || state.activeId;
        filter = "all"; render(); toast(`Imported ${s.trips.length} trip${s.trips.length === 1 ? "" : "s"}`);
      } catch (e) { toast("That file isn't a Travel Planner backup."); }
    };
    reader.readAsText(file);
  }

  /* ---------- Events ---------- */
  document.addEventListener("click", (e) => {
    const overlay = e.target.closest("[data-overlay]");
    if (overlay && e.target === overlay) { closeModal(); return; }
    const f = e.target.closest("[data-filter]");
    if (f) { filter = f.dataset.filter; render(); return; }
    const tb = e.target.closest("[data-tab]");
    if (tb) { finder.tab = tb.dataset.tab; render(); return; }
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const trip = activeTrip();
    const id = el.dataset.id;
    switch (el.dataset.action) {
      case "close": closeModal(); break;
      case "new-trip": tripForm(); break;
      case "edit-trip": tripForm(trip); break;
      case "add-item": itemForm(); break;
      case "edit-item": itemForm(trip.items.find((x) => x.id === id)); break;
      case "cycle": {
        const it = trip.items.find((x) => x.id === id);
        if (!it || it.status === "spend") break;
        it.status = { todo: "booked", booked: "paid", paid: "todo" }[it.status];
        render(); toast(`Marked ${STATUS[it.status].toLowerCase()}`);
        break;
      }
      case "clear-example":
        state.trips = state.trips.filter((x) => !x.example);
        state.activeId = state.trips[0]?.id;
        render(); if (!state.trips.length) tripForm();
        break;
      case "helper-settings": helperSettings(); break;
      case "search": runSearch(trip); break;
      case "sample-search": sampleSearch(trip); break;
      case "add-result": addResult(el.dataset.key, trip); break;
      case "add-flight": addFlightManually(trip); break;
      case "export": exportJSON(); break;
      case "copy": copyJSON(); break;
    }
  });
  document.getElementById("newTripBtn").addEventListener("click", () => tripForm());
  document.getElementById("syncBtn").addEventListener("click", () => syncDialog());
  document.getElementById("tripSelect").addEventListener("change", (e) => { state.activeId = e.target.value; filter = "all"; render(); });
  // Keep what's typed in the search controls across re-renders.
  const onFinderInput = (e) => {
    const k = e.target.dataset && e.target.dataset.finder;
    if (k && finder.inputs[finder.tab]) finder.inputs[finder.tab][k] = e.target.value;
    if (k && finder.tab === "flights") {
      const t = activeTrip();
      document.querySelectorAll('a[href^="https://www.google.com/travel/flights"]').forEach((a) => { if (t && !a.closest(".results-note")) a.href = flightsUrl(finder.inputs.flights, t); });
    }
  };
  document.addEventListener("input", onFinderInput);
  document.addEventListener("change", onFinderInput);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.dataset && e.target.dataset.finder) {
      e.preventDefault();
      const t = activeTrip();
      if (!t) return;
      const src = sourceFor(finder.tab);
      if (src === "link") { const a = document.getElementById("gfLink"); if (a) a.click(); }
      else if (src === "none") sampleSearch(t);
      else runSearch(t);
    }
  });
  document.addEventListener("change", (e) => {
    if (e.target.id === "importFile" && e.target.files[0]) { importFile(e.target.files[0]); e.target.value = ""; }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

  /* ---------- Night-sky stars in the header ---------- */
  function drawStars() {
    const c = document.getElementById("stars");
    if (!c) return;
    const r = c.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    c.width = Math.max(1, r.width * dpr); c.height = Math.max(1, r.height * dpr);
    const ctx = c.getContext("2d");
    ctx.scale(dpr, dpr);
    let seed = 7;
    const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const n = Math.round(r.width / 9);
    for (let i = 0; i < n; i++) {
      const x = rand() * r.width, y = rand() * r.height * 0.55;
      ctx.globalAlpha = 0.25 + rand() * 0.6;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.arc(x, y, rand() * 1.2 + 0.3, 0, Math.PI * 2); ctx.fill();
    }
  }
  drawStars();
  let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(drawStars, 150); });

  render();
  initCloud();
})();
</script>
